name: Security

on:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled, main always gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: composer audit · npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: composer audit
        run: composer audit --locked

      - name: npm audit (runtime dependencies)
        working-directory: widget
        run: npm audit --omit=dev --audit-level=low

  dependency-review:
    name: Dependency review
    # Needs the dependency graph: public repository or GitHub Code Security.
    # Enable it with the repository variable DEPENDENCY_REVIEW=true.
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
